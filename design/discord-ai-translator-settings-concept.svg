<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760">
  <defs>
    <linearGradient id="darkHero" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#202837"/>
      <stop offset="1" stop-color="#18231e"/>
    </linearGradient>
    <linearGradient id="lightHero" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#edf4ff"/>
      <stop offset="1" stop-color="#ebfff7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <style>
      .title { font: 700 24px "Segoe UI", sans-serif; letter-spacing: 0; }
      .subtitle { font: 400 13px "Segoe UI", sans-serif; letter-spacing: 0; }
      .h { font: 700 16px "Segoe UI", sans-serif; letter-spacing: 0; }
      .label { font: 700 12px "Segoe UI", sans-serif; letter-spacing: 0; }
      .value { font: 600 14px "Segoe UI", sans-serif; letter-spacing: 0; }
      .tiny { font: 600 11px "Segoe UI", sans-serif; letter-spacing: 0; }
      .mono { font: 600 13px "Consolas", monospace; letter-spacing: 0; }
    </style>
  </defs>

  <rect width="1180" height="760" fill="#111318"/>
  <text x="42" y="48" class="title" fill="#f3f4f8">Discord AI Translator 设置页设计方向</text>
  <text x="42" y="76" class="subtitle" fill="#aeb5c2">同一套结构适配 Discord 深色 / 浅色主题；控件边界、焦点态和下拉箭头要清楚。</text>

  <!-- Dark theme mock -->
  <g transform="translate(42,112)">
    <rect width="520" height="586" rx="18" fill="#1e1f26" stroke="#31343d"/>
    <rect x="24" y="24" width="472" height="112" rx="14" fill="url(#darkHero)" stroke="#384457"/>
    <rect x="44" y="48" width="52" height="52" rx="13" fill="#6ee7b7"/>
    <text x="58" y="80" class="h" fill="#08111a">AI</text>
    <text x="112" y="64" class="title" fill="#f3f4f8">Discord AI 翻译助手</text>
    <text x="112" y="90" class="subtitle" fill="#b7bfca">输入润色和频道翻译独立配置，API Key 仅保存在本机。</text>
    <rect x="112" y="106" width="76" height="22" rx="11" fill="#2d3a4e" stroke="#51617b"/>
    <text x="127" y="121" class="tiny" fill="#dce6f4">输入润色</text>
    <rect x="196" y="106" width="100" height="22" rx="11" fill="#2d3a4e" stroke="#51617b"/>
    <text x="211" y="121" class="tiny" fill="#dce6f4">频道消息翻译</text>
    <rect x="304" y="106" width="78" height="22" rx="11" fill="#2d3a4e" stroke="#51617b"/>
    <text x="319" y="121" class="tiny" fill="#dce6f4">DeepSeek V4</text>

    <g transform="translate(24,160)" filter="url(#shadow)">
      <rect width="472" height="88" rx="14" fill="#24262f" stroke="#3b3f4c"/>
      <text x="18" y="30" class="h" fill="#f1f3f7">基础设置</text>
      <text x="18" y="54" class="label" fill="#b4bbc8">界面语言</text>
      <rect x="250" y="20" width="200" height="46" rx="10" fill="#181a20" stroke="#76829a" stroke-width="1.5"/>
      <text x="268" y="49" class="value" fill="#f3f4f8">中文</text>
      <path d="M424 37 L432 45 L440 37" fill="none" stroke="#f3f4f8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(24,268)">
      <rect width="472" height="176" rx="14" fill="#24262f" stroke="#3b3f4c"/>
      <text x="18" y="30" class="h" fill="#f1f3f7">输入润色</text>
      <text x="18" y="54" class="subtitle" fill="#aeb5c2">根据提示词重写草稿，回填到输入框。</text>
      <text x="18" y="84" class="label" fill="#b4bbc8">服务商</text>
      <rect x="18" y="94" width="208" height="46" rx="10" fill="#181a20" stroke="#596478"/>
      <text x="34" y="124" class="value" fill="#f3f4f8">DeepSeek</text>
      <path d="M198 111 L206 119 L214 111" fill="none" stroke="#f3f4f8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="246" y="84" class="label" fill="#b4bbc8">模型</text>
      <rect x="246" y="94" width="208" height="46" rx="10" fill="#181a20" stroke="#596478"/>
      <text x="262" y="124" class="mono" fill="#dce6f4">deepseek-v4-flash</text>
      <text x="18" y="160" class="tiny" fill="#6ee7b7">已启用</text>
      <rect x="404" y="144" width="50" height="24" rx="12" fill="#1f6f56" stroke="#6ee7b7"/>
      <circle cx="438" cy="156" r="9" fill="#6ee7b7"/>
    </g>

    <g transform="translate(24,464)">
      <rect width="472" height="84" rx="14" fill="#24262f" stroke="#3b3f4c"/>
      <text x="18" y="31" class="h" fill="#f1f3f7">频道消息翻译</text>
      <text x="18" y="56" class="subtitle" fill="#aeb5c2">右键或按钮翻译消息；与输入润色互不影响。</text>
      <rect x="374" y="22" width="80" height="38" rx="10" fill="#5865f2"/>
      <text x="399" y="46" class="value" fill="#fff">配置</text>
    </g>
  </g>

  <!-- Light theme mock -->
  <g transform="translate(620,112)">
    <rect width="520" height="586" rx="18" fill="#f7f8fb" stroke="#d9dee8"/>
    <rect x="24" y="24" width="472" height="112" rx="14" fill="url(#lightHero)" stroke="#cbd7e7"/>
    <rect x="44" y="48" width="52" height="52" rx="13" fill="#0f766e"/>
    <text x="58" y="80" class="h" fill="#f8fffc">AI</text>
    <text x="112" y="64" class="title" fill="#1f2430">Discord AI 翻译助手</text>
    <text x="112" y="90" class="subtitle" fill="#596170">输入润色和频道翻译独立配置，API Key 仅保存在本机。</text>
    <rect x="112" y="106" width="76" height="22" rx="11" fill="#ffffff" stroke="#c8d5e8"/>
    <text x="127" y="121" class="tiny" fill="#2f3b4d">输入润色</text>
    <rect x="196" y="106" width="100" height="22" rx="11" fill="#ffffff" stroke="#c8d5e8"/>
    <text x="211" y="121" class="tiny" fill="#2f3b4d">频道消息翻译</text>
    <rect x="304" y="106" width="78" height="22" rx="11" fill="#ffffff" stroke="#c8d5e8"/>
    <text x="319" y="121" class="tiny" fill="#2f3b4d">DeepSeek V4</text>

    <g transform="translate(24,160)" filter="url(#shadow)">
      <rect width="472" height="88" rx="14" fill="#ffffff" stroke="#d7dce7"/>
      <text x="18" y="30" class="h" fill="#232834">基础设置</text>
      <text x="18" y="54" class="label" fill="#596170">界面语言</text>
      <rect x="250" y="20" width="200" height="46" rx="10" fill="#f4f6fa" stroke="#8a98ad" stroke-width="1.5"/>
      <text x="268" y="49" class="value" fill="#232834">中文</text>
      <path d="M424 37 L432 45 L440 37" fill="none" stroke="#232834" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(24,268)">
      <rect width="472" height="176" rx="14" fill="#ffffff" stroke="#d7dce7"/>
      <text x="18" y="30" class="h" fill="#232834">输入润色</text>
      <text x="18" y="54" class="subtitle" fill="#596170">根据提示词重写草稿，回填到输入框。</text>
      <text x="18" y="84" class="label" fill="#596170">服务商</text>
      <rect x="18" y="94" width="208" height="46" rx="10" fill="#f4f6fa" stroke="#8a98ad"/>
      <text x="34" y="124" class="value" fill="#232834">DeepSeek</text>
      <path d="M198 111 L206 119 L214 111" fill="none" stroke="#232834" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="246" y="84" class="label" fill="#596170">模型</text>
      <rect x="246" y="94" width="208" height="46" rx="10" fill="#f4f6fa" stroke="#8a98ad"/>
      <text x="262" y="124" class="mono" fill="#2f3b4d">deepseek-v4-flash</text>
      <text x="18" y="160" class="tiny" fill="#0f766e">已启用</text>
      <rect x="404" y="144" width="50" height="24" rx="12" fill="#d5f4e8" stroke="#0f766e"/>
      <circle cx="438" cy="156" r="9" fill="#0f766e"/>
    </g>

    <g transform="translate(24,464)">
      <rect width="472" height="84" rx="14" fill="#ffffff" stroke="#d7dce7"/>
      <text x="18" y="31" class="h" fill="#232834">频道消息翻译</text>
      <text x="18" y="56" class="subtitle" fill="#596170">右键或按钮翻译消息；与输入润色互不影响。</text>
      <rect x="374" y="22" width="80" height="38" rx="10" fill="#5865f2"/>
      <text x="399" y="46" class="value" fill="#fff">配置</text>
    </g>
  </g>
</svg>
