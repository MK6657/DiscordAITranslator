name: Windows CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }} on Windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify release metadata, source, artifact, critical chains, and installer rollback
        run: npm run release:check
